spring:
  datasource:
    url: jdbc:h2:mem:corebridge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

corebridge:
  integration:
    external-provider-base-url: http://localhost:${server.port:8080}
    import-path: /api/external/mock/customers
